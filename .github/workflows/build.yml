name: Build and push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole test suite (ci.yml) runs first, on GitHub-hosted runners. ci.yml
  # has no push trigger of its own, so this is the only run of the tests for a
  # push to main, and nothing is built or deployed unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # Only a repository that has opted in to a self-hosted runner builds and
    # deploys; elsewhere (such as a public fork) this job and deploy-dev show
    # as skipped instead of waiting for a runner that never comes.
    if: vars.SELF_HOSTED_RUNNER == 'true'
    # Runs on this machine so it can push to the local registry at
    # localhost:5000 (a GitHub-hosted runner cannot reach it).
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Compute image tag
        id: image
        shell: powershell
        run: |
          $tag = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmmss") + "-" + $env:GITHUB_SHA.Substring(0,7)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Log in to the registry
        shell: powershell
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if ($env:REGISTRY_USERNAME) {
            $registry = ($env:IMAGE_REPOSITORY -split '/')[0]
            $env:REGISTRY_PASSWORD | docker login $registry --username $env:REGISTRY_USERNAME --password-stdin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build, tag, and push image
        shell: powershell
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          $image = $env:IMAGE_REPOSITORY
          $tag = $env:IMAGE_TAG
          docker build --build-arg "APP_VERSION=${tag}" -t "${image}:${tag}" -t "${image}:dev" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push "${image}:${tag}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push "${image}:dev"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy-dev:
    needs: build
    if: vars.SELF_HOSTED_RUNNER == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
